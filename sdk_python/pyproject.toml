[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI already has an unrelated `allyourbase` project; use `allyourbase-sdk`
# if/when this SDK gets a GA registry release.
name = "allyourbase-sdk"
version = "0.1.0"
description = "Python SDK for AllYourBase"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
    "twine>=6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/allyourbase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
python_version = "3.9"
